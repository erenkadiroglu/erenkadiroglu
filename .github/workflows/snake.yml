name: snake

# Renders the contribution snake into the `output` branch, themed to the
# README palette. The first colour of color_dots is the empty cell: on the
# dark theme it must stay a visible slate against GitHub's #0d1117.
on:
  schedule:
    - cron: '41 */12 * * *' # every 12 hours
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=2a241b&color_dots=#ebe8e1,#e6d6b0,#ccb077,#9e7e40,#6e5420
            dist/github-snake-dark.svg?palette=github-dark&color_snake=e8dcc4&color_dots=#23272e,#4a3f2a,#7a6438,#ad8d52,#e0c58e

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'chore(snake): update snake animation'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
