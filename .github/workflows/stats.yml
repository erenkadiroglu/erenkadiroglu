name: stats

# Re-renders assets/generated/{streak,stats,langs}-*.svg from the GitHub GraphQL API.
on:
  schedule:
    - cron: '23 4 * * *' # daily, off the top of the hour
  workflow_dispatch:
  push:
    paths:
      - 'tools/src/**'
      - 'tools/fonts/**'
      - '.github/workflows/stats.yml'

permissions:
  contents: write

concurrency:
  group: stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render stats cards
        working-directory: tools
        env:
          # GITHUB_TOKEN only sees public activity. Add a personal access token
          # as the STATS_TOKEN secret to count private repositories too.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          INCLUDE_PRIVATE: ${{ secrets.STATS_TOKEN != '' && 'true' || 'false' }}
          GITHUB_USER: ${{ github.repository_owner }}
          # Notebooks store outputs as JSON, which inflates their byte counts.
          EXCLUDE_LANGUAGES: Jupyter Notebook
        run: node src/stats/index.mjs

      - name: Commit changes
        run: |
          git add assets/generated
          if git diff --cached --quiet; then
            echo "Stats cards unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(stats): refresh stats cards'
          git push
